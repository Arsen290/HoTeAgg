services:
  postgres:
    # image: timescale/timescaledb:latest-pg16   # TimescaleDB disabled, plain PostgreSQL is used
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  # Runs the jar built on the host (no Maven download inside Docker):
  #   ./mvnw -DskipTests package && (cd simulator && ../mvnw -q package)
  app:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    volumes:
      - ./target/HoTeAgg-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
  # Separate "devices" process: only talks to the backend over WebSocket.
  # Started automatically; it retries with backoff until the backend is ready.
  simulator:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-jar", "simulator.jar"]
    volumes:
      - ./simulator/target/hoteagg-simulator-0.0.1-SNAPSHOT.jar:/app/simulator.jar:ro
    depends_on:
      - app
    environment:
      SIMULATOR_URL: ws://app:8080/ws/telemetry
      SIMULATOR_DEVICES: ${SIMULATOR_DEVICES:-3}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-10}
    restart: unless-stopped
volumes:
  pgdata:
