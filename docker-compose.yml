services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hoteagg
      POSTGRES_USER: hoteagg
      POSTGRES_PASSWORD: hoteagg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoteagg"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hoteagg
      DB_USER: hoteagg
      DB_PASSWORD: hoteagg
    ports:
      - "8080:8080"

volumes:
  pgdata:

